<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>قائمة الطاولة</title>
<link rel="stylesheet" href="shared.css">
<style>
:root{--bg:#0e1712;--card:#15241b;--bd:#1f3a2a;--tx:#eafaf0;--acc:#1fe35f;--card2:#1b2f23}
body{display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px;font-weight:700}
header .ic{width:34px;height:34px;display:grid;place-items:center;background:var(--card);border-radius:10px;cursor:pointer}
.online{display:block;width:max-content;margin:0 auto 10px;background:rgba(31,227,95,.12);color:var(--acc);font-size:11px;padding:3px 12px;border-radius:99px}
.search{margin:0 16px 12px;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px;width:calc(100% - 32px);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;flex:0 0 auto;min-height:52px;align-items:center}
#app>*{flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card2);padding:8px 18px;border-radius:99px;white-space:nowrap;font-size:13px}
.chip.on{background:var(--acc);color:#04210f;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 90px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.pic{height:110px;display:grid;place-items:center;font-size:54px;background:radial-gradient(circle at 50% 40%,#2a4a37,#12201a)}
.item .in{padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.item b{font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center}
.price{color:var(--acc);font-weight:700;font-size:14px}
.qty{display:flex;align-items:center;gap:6px;background:#0f1d15;border-radius:99px;padding:3px}
.qty button{width:24px;height:24px;border-radius:50%;background:#2a4636;color:#fff;font-weight:700}
.qty button.p{background:var(--acc);color:#04210f}
.qty span{min-width:14px;text-align:center;font-size:13px}
nav.bot{position:fixed;bottom:0;width:100%;max-width:440px;background:#0b140f;border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 12px}
nav.bot button{background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bot button.on{color:var(--acc)}nav.bot i{font-style:normal;font-size:20px}
.badge{position:absolute;top:-4px;left:-8px;background:var(--acc);color:#04210f;border-radius:99px;font-size:10px;padding:0 5px;font-weight:700}
.page{padding:6px 16px 120px}
.title{font-size:20px;font-weight:700;margin:6px 0 14px}
.line{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);padding:10px;border-radius:14px;margin-bottom:10px}
.line .e{font-size:34px;width:54px;height:54px;border-radius:10px;display:grid;place-items:center;background:#0f1d15}
.line .nm{flex:1}.line small{color:var(--acc)}
.rm{color:#ff6b6b;font-size:11px;background:none;display:block;margin-top:4px}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:6px}
.sum .row{padding:4px 0;color:#bcd}.sum .t{color:var(--tx);font-weight:700;font-size:17px;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}
.cta{position:fixed;bottom:0;width:100%;max-width:440px;padding:12px 16px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.cta .btn{width:100%;font-size:16px;padding:15px;border-radius:14px;display:block}
.tabs{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:none;padding:10px;border-radius:9px;font-size:13px}.tabs button.on{background:#0b140f;border:1px solid var(--bd)}
label{display:block;font-size:12px;color:#cfe;margin:12px 0 6px}
.inp{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:13px;outline:none;direction:ltr;text-align:left}
.inp:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:5px;background:#1b2f23;border-radius:9px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.tot{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:6px}
.tot big{font-size:26px;font-weight:800;display:block;direction:ltr;text-align:right}
.note{border:1px dashed var(--bd);border-radius:12px;padding:12px;font-size:12px;color:#9ab;margin-top:16px}
.steps{display:flex;flex-direction:column;gap:0;margin:18px 6px}
.stp{display:flex;gap:12px;align-items:flex-start;padding-bottom:20px;position:relative;color:var(--muted)}
.stp:not(:last-child)::before{content:'';position:absolute;right:11px;top:24px;bottom:0;width:2px;background:var(--bd)}
.stp .c{width:24px;height:24px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:12px;z-index:1}
.stp.on{color:var(--tx)}.stp.on .c{background:var(--acc);color:#04210f}
.pic{overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;width:100%;max-width:440px;padding:18px 16px 22px;max-height:88vh;overflow:auto}
.opts{display:flex;flex-wrap:wrap;gap:8px}.oc{background:var(--card2);border:1px solid var(--bd);padding:9px 14px;border-radius:99px;font-size:13px;color:var(--tx)}.oc.on{background:var(--acc);color:#04210f;border-color:var(--acc);font-weight:700}
.oc2{font-size:12px;color:#ffd27a;margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--acc);color:#04210f;padding:9px 18px;border-radius:99px;font-weight:700;font-size:13px;z-index:9}
</style></head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="store.js"></script>
<script>
const q = new URLSearchParams(location.search);
const table = parseInt(q.get('table')) || null;
let view = 'menu', cat = 'all', term = '', cart = [];
try { cart = JSON.parse(sessionStorage.getItem('cart') || '[]'); if (!Array.isArray(cart)) cart = []; } catch (e) { cart = []; }
const SK = 'myOrders_' + (table || 0);
let myIds = []; try { myIds = JSON.parse(localStorage.getItem(SK) || '[]'); } catch (e) {}
function saveIds() { localStorage.setItem(SK, JSON.stringify(myIds)); }
let seenChat = parseInt(sessionStorage.getItem('seenChat') || '0');
function chatMsgs() { const s = load(); return (s.chat && s.chat[table || 'tk']) || []; }
function unread() { return chatMsgs().filter(m => m.from === 'w' && m.t > seenChat).length; }
if (myIds.length) view = 'track';
const $ = s => document.querySelector(s);
const prod = id => MENU.find(x => x.id == id);
const items = () => cart.map(l => { const m = prod(l.id); return m ? { ...m, qty: l.qty, opts: l.opts || [], note: l.note || '', k: l.k } : null; }).filter(Boolean);
const count = () => items().reduce((a, i) => a + i.qty, 0);
const sub = () => items().reduce((a, i) => a + i.price * i.qty, 0);
const FEE = 0.5;
let orderNote = sessionStorage.getItem('onote') || '';
function saveCart() { sessionStorage.setItem('cart', JSON.stringify(cart)); }
const qtyOf = id => cart.filter(l => l.id == id).reduce((a, l) => a + l.qty, 0);
function addLine(id, opts, note) {
  opts = opts || []; note = (note || '').trim();
  const ex = cart.find(l => l.id == id && !l.note && !note && JSON.stringify(l.opts || []) === JSON.stringify(opts));
  if (ex) ex.qty++; else cart.push({ k: Date.now() + '_' + Math.floor(Math.random() * 1e6), id, qty: 1, opts, note });
  saveCart(); render();
}
function lineQty(k, d) { const l = cart.find(x => x.k === k); if (!l) return; l.qty += d; if (l.qty <= 0) cart = cart.filter(x => x !== l); saveCart(); render(); }
function prodMinus(id) { const ls = cart.filter(l => l.id == id); if (ls.length) lineQty(ls[ls.length - 1].k, -1); }
function plus(id) { const m = prod(id); if (m && (m.opts || []).some(g => OPTION_GROUPS[g])) openSheet(id); else addLine(id); }
function setNote(k, v) { const l = cart.find(x => x.k === k); if (l) { l.note = v.slice(0, 120); saveCart(); } }
const pic = m => m.img ? `<img src="${m.img}" alt="">` : esc(m.emoji || '🍽');
/* option sheet: pick sugar / salt / ... + a free note before adding */
let sheet = null;
function openSheet(id) { const m = prod(id); sheet = { id, sel: {}, note: '' }; (m.opts || []).forEach(g => { if (OPTION_GROUPS[g]) sheet.sel[g] = OPTION_GROUPS[g].def; }); render(); }
function pick(g, v) { sheet.sel[g] = v; render(); }
function closeSheet() { sheet = null; render(); }
function confirmSheet() { const m = prod(sheet.id); const opts = (m.opts || []).filter(g => OPTION_GROUPS[g]).map(g => sheet.sel[g]); const note = sheet.note; sheet = null; addLine(m.id, opts, note); }
function sheetHtml() {
  if (!sheet) return '';
  const m = prod(sheet.id);
  return `<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sh"><div class="row"><b style="font-size:17px">${esc(m.name)}</b><span class="price">${money(m.price)}</span></div>
  ${(m.opts || []).filter(g => OPTION_GROUPS[g]).map(g => `<label>${OPTION_GROUPS[g].name}</label><div class="opts">${OPTION_GROUPS[g].choices.map(c => `<button class="oc ${sheet.sel[g] === c ? 'on' : ''}" onclick="pick('${g}','${c}')">${c}</button>`).join('')}</div>`).join('')}
  <label>ملاحظة خاصة بهذا الصنف (اختياري)</label><input class="inp" style="direction:rtl;text-align:right" maxlength="120" value="${esc(sheet.note)}" oninput="sheet.note=this.value" placeholder="مثال: ساخن جدًا، بدون حليب...">
  <button class="btn" style="width:100%;margin-top:14px;padding:14px" onclick="confirmSheet()">أضف للسلة</button></div></div>`;
}
function go(v) { view = v; render(); scrollTo(0, 0); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }

function qtyCtl(id) {
  const n = qtyOf(id);
  return `<div class="qty"><button class="p" onclick="plus(${id})">+</button>${n ? `<span>${n}</span><button onclick="prodMinus(${id})">−</button>` : ''}</div>`;
}
function lineCtl(k, n) { return `<div class="qty"><button class="p" onclick="lineQty('${k}',1)">+</button><span>${n}</span><button onclick="lineQty('${k}',-1)">−</button></div>`; }
function nav() {
  const b = (v, i, t, extra = '') => `<button class="${view === v ? 'on' : ''}" onclick="go('${v}')"><i>${i}</i>${t}${extra}</button>`;
  return `<nav class="bot">${b('menu', '🏠', 'القائمة')}${b('cart', '🛒', 'السلة', count() ? `<span class="badge">${count()}</span>` : '')}${b('track', '📋', 'طلبي')}${myIds.length ? b('chat', '💬', 'النادل', unread() ? `<span class="badge">${unread()}</span>` : '') : ''}</nav>`;
}
function vMenu() {
  if (cat !== 'all' && !CATS[cat]) cat = 'all';
  const list = MENU.filter(m => !m.hidden && (cat === 'all' || m.cat === cat) && m.name.includes(term));
  return `<div style="display:flex;justify-content:center;padding-top:14px"><span class="brand"><img data-brand-logo hidden alt=""><b data-brand-name></b></span></div><header><div class="ic">☰</div><span>${table ? 'طاولة ' + table : 'طلب سفري'}</span><div class="ic" onclick="go('cart')">🛒</div></header>
  <span class="online">${cloudOn() ? '● متصل' : '● وضع محلي'}</span>
  <input class="search" placeholder="🔍 ابحث عن منتج..." value="${esc(term)}" oninput="term=this.value;render(true)">
  <div class="chips">${['all', ...Object.keys(CATS)].map(c => `<div class="chip ${cat === c ? 'on' : ''}" onclick="cat='${c}';render()">${c === 'all' ? 'الكل' : esc(CATS[c])}</div>`).join('')}</div>
  <div class="grid">${list.map(m => `<div class="item"><div class="pic">${pic(m)}</div><div class="in"><b>${esc(m.name)}</b><div class="row"><span class="price">${money(m.price)}</span>${qtyCtl(m.id)}</div></div></div>`).join('') || '<div class="empty" style="grid-column:1/-1">لا توجد نتائج</div>'}</div>${nav()}${sheetHtml()}`;
}
function vCart() {
  const it = items();
  if (!it.length) return `<div class="page"><div class="title">مراجعة السلة</div><div class="empty">🛒<br>السلة فارغة</div></div>${nav()}`;
  return `<div class="page"><div class="row"><div class="title">مراجعة السلة</div><small style="color:var(--muted)">${count()} عناصر</small></div>
  ${it.map(i => `<div class="line" style="flex-wrap:wrap"><div class="e" style="overflow:hidden">${pic(i)}</div><div class="nm"><b>${esc(i.name)}</b>${i.opts.length ? `<div class="oc2">${esc(i.opts.join(' · '))}</div>` : ''}<small>${money(i.price)}</small><button class="rm" onclick="lineQty('${i.k}',-${i.qty})">حذف</button></div>${lineCtl(i.k, i.qty)}
  <input class="inp" style="direction:rtl;text-align:right;width:100%;margin-top:6px;padding:9px;font-size:13px" maxlength="120" placeholder="📝 ملاحظة على هذا الصنف..." value="${esc(i.note)}" oninput="setNote('${i.k}',this.value)"></div>`).join('')}
  <label>📝 ملاحظة على الطلب كاملًا (اختياري)</label><textarea class="inp" rows="2" maxlength="200" style="direction:rtl;text-align:right" placeholder="مثال: أريد كل شيء معًا، حساسية من المكسرات..." oninput="orderNote=this.value;sessionStorage.setItem('onote',this.value)">${esc(orderNote)}</textarea>
  <div class="sum"><div class="row"><span>المجموع الفرعي</span><span>${money(sub())}</span></div><div class="row"><span>رسوم الخدمة</span><span>${money(FEE)}</span></div><div class="row t"><span>الإجمالي</span><span class="price">${money(sub() + FEE)}</span></div></div><div class="note" style="margin-top:12px">💡 الدفع يتم بعد انتهائك عبر النادل: كاش أو بجهاز البطاقة.</div></div>
  <div class="cta"><button class="btn" onclick="sendOrder()">إرسال الطلب للنادل ✓</button></div>`;
}
let finished = false;
function sendOrder() {
  unlockAudio();
  const it = items().map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty, st: i.st, cat: i.cat, opts: i.opts, note: i.note }));
  if (!it.length) return toast('السلة فارغة');
  toast('جاري الإرسال...');
  addOrder(table, it, o => {
    if (!o) return toast('تعذر الإرسال، تحقق من الاتصال بالإنترنت');
    finished = false; myIds.push(o.id); saveIds();
    cart = []; orderNote = ''; sessionStorage.removeItem('cart'); sessionStorage.removeItem('onote'); go('track');
  }, orderNote);
}
function reqPayT(m) { unlockAudio(); requestPayTable(table, m); toast(m === 'cash' ? 'تم إبلاغ النادل — جهّز المبلغ' : 'تم إبلاغ النادل — سيحضر جهاز الدفع'); }
function callWaiter() { unlockAudio(); sendChat(table, 'c', 'الزبون', '🙋 الزبون ينادي النادل', 'call', ok => toast(ok ? 'تم إبلاغ النادل 🙋' : 'تعذر الإرسال')); }
function quick(t) { unlockAudio(); sendChat(table, 'c', 'الزبون', t, 'msg'); }
function sendMsg() { const i = $('#cmsg'); const t = i.value.trim(); if (!t) return; i.value = ''; unlockAudio(); sendChat(table, 'c', 'الزبون', t, 'msg'); }
function vTrack() {
  if (!synced()) return `<div class="page"><div class="empty">⏳ جاري التحميل...</div></div>${nav()}`;
  const s = load();
  const all = myIds.map(id => s.orders.find(o => o.id === id)).filter(Boolean);
  const act = all.filter(o => !(o.paid && o.status === 'served'));
  if (!act.length) {
    if (all.length) finished = true;
    if (myIds.length) { myIds = []; saveIds(); }
    const done = finished;
    return `<div class="page"><div class="title">طلبي</div><div class="empty">${done ? '✅ تم الدفع، شكرًا لزيارتكم' : '📋<br>لا يوجد طلب نشط'}</div><button class="btn" style="width:100%" onclick="go('menu')">طلب جديد</button></div>${nav()}`;
  }
  const order = ['pending', 'new', 'preparing', 'ready', 'served'];
  const wn = [...new Set(act.map(o => o.waiter).filter(Boolean))].join('، ');
  const cards = act.map(o => {
    const idx = order.indexOf(o.status);
    const lbl = ['تم إرسال الطلب — بانتظار النادل', 'النادل ' + (o.waiter || '') + ' استلم طلبك', 'قيد التحضير 👨‍🍳', 'طلبك جاهز — النادل ' + (o.waiter || '') + ' قادم إليك 🎉', 'تم التقديم — بالهنا!'][idx];
    return `<div class="sum" style="margin-bottom:12px"><div class="row"><b>فاتورة #${o.id}</b><span class="price">${o.paid ? 'مدفوع ✓' : money(o.total + FEE)}</span></div>
    <div style="margin:8px 0 4px;font-weight:700;color:${o.status === 'ready' ? 'var(--acc)' : 'inherit'}">${lbl}</div><div class="bar"><i style="width:${(idx + 1) * 20}%"></i></div>
    ${o.items.map(i => `<div class="row" style="font-size:13px"><span>${itemHtml(i)}</span><span>${money(i.price * i.qty)}</span></div>`).join('')}${o.note ? `<div class="oc2" style="margin-top:6px">📝 ${esc(o.note)}</div>` : ''}</div>`;
  }).join('');
  const payable = act.filter(o => !o.paid && o.status !== 'pending');
  const req = payable.find(o => o.payReq);
  const tot = payable.reduce((a, o) => a + o.total + FEE, 0);
  let pay = '';
  if (req) pay = `<div class="note" style="margin-top:0">⏳ تم إبلاغ النادل ${wn} — ${req.payReq === 'cash' ? 'جهّز ' + money(tot) + ' نقدًا' : 'سيحضر جهاز الدفع بالبطاقة'}</div>`;
  else if (payable.length) pay = `<div class="title" style="font-size:16px;margin-top:6px">انتهيت؟ اطلب الحساب (${money(tot)})</div><div class="two"><button class="btn" onclick="reqPayT('cash')">💵 كاش</button><button class="btn" onclick="reqPayT('card')">💳 بطاقة</button></div>`;
  const hint = audioReady() ? '' : `<div class="note" style="margin:0 0 12px;color:var(--acc)" onclick="unlockAudio();render()">🔔 المس هنا لتفعيل التنبيهات الصوتية</div>`;
  return `<div class="page"><div class="title">طاولتي ${table ? table : '(سفري)'}${wn ? ' · النادل ' + wn : ''}</div>${hint}${cards}
  <div class="two" style="margin-bottom:12px"><button class="btn ghost" onclick="go('menu')">➕ اطلب المزيد</button><button class="btn ghost" onclick="callWaiter()">🙋 نادِ النادل</button></div>${pay}</div>${nav()}`;
}
function vChat() {
  seenChat = Date.now(); sessionStorage.setItem('seenChat', seenChat);
  const m = chatMsgs();
  const wn = (() => { const s = load(); return tableWaiter(s, table); })();
  return `<div class="page"><div class="title">💬 التواصل مع النادل${wn ? ' ' + wn : ''}</div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;min-height:120px">${m.length ? m.map(x => `<div style="align-self:${x.from === 'c' ? 'flex-start' : 'flex-end'};max-width:80%;background:${x.from === 'c' ? 'var(--acc)' : 'var(--card2)'};color:${x.from === 'c' ? '#04210f' : 'var(--tx)'};padding:9px 13px;border-radius:14px;font-size:14px">${x.from === 'w' ? '<small style="opacity:.7;display:block">' + esc(x.name) + '</small>' : ''}${esc(x.text)}</div>`).join('') : '<div class="empty" style="padding:30px 0">اكتب رسالة أو اضغط أحد الأزرار</div>'}</div>
  <div class="two" style="margin-bottom:8px"><button class="btn ghost" onclick="callWaiter()">🙋 نادِ النادل</button><button class="btn ghost" onclick="quick('💧 أريد ماء')">💧 ماء</button><button class="btn ghost" onclick="quick('🧂 أحتاج أدوات إضافية')">🧂 أدوات</button><button class="btn ghost" onclick="quick('⚠️ عندي ملاحظة على الطلب')">⚠️ ملاحظة</button></div>
  <div style="display:flex;gap:8px"><input id="cmsg" class="inp" style="direction:rtl;text-align:right" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" onclick="sendMsg()">إرسال</button></div></div>${nav()}`;
}
function newOrder() { go('menu'); }
function render(keepFocus) {
  setTimeout(applyBrand, 0);
  const a = $('#app'); const f = document.activeElement && document.activeElement.className === 'search';
  const cm = $('#cmsg'), cmv = cm ? cm.value : '', cmf = cm && document.activeElement === cm;
  a.innerHTML = { menu: vMenu, cart: vCart, track: vTrack, chat: vChat }[view]();
  const c2 = $('#cmsg'); if (c2) { c2.value = cmv; if (cmf) c2.focus(); }
  if (f) { const i = $('.search'); i.focus(); i.setSelectionRange(term.length, term.length); }
}
render();
onChange(() => { if (view === 'track' || view === 'chat') render(); }, 1500);
watchEvents(e => {
  if (!myIds.length) return;
  if (e.order && myIds.includes(e.order)) {
    if (e.type === 'accepted') { toast('النادل ' + e.waiter + ' استلم طلبك ✅'); alertUser('النادل ' + e.waiter + ' استلم طلبك رقم ' + e.order); }
    if (e.type === 'order_ready') { toast('🎉 طلبك جاهز — النادل ' + e.waiter + ' قادم إليك'); alertUser('طلبك رقم ' + e.order + ' جاهز، والنادل ' + e.waiter + ' قادم إليك'); }
  }
  if (e.type === 'chat' && e.from === 'w' && e.table === (table || null)) { toast('💬 ' + e.name + ': ' + e.text); alertUser('رسالة من النادل ' + e.name + ': ' + e.text); }
  render();
});
document.addEventListener('click', () => unlockAudio(), { once: true });
</script></body></html>
