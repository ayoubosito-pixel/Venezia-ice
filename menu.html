<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#160e08">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<title>قائمة الطاولة</title>
<link rel="stylesheet" href="shared.css">
<style>
:root{--bg:#160e08;--card:#241811;--bd:#4a3622;--tx:#f7ecd9;--acc:#d9a441;--card2:#2d1f15;--ok:#e3b85c;--muted:#a8967c;--ink:#2a1804}
body{background:radial-gradient(ellipse at 50% 0%,#2e1d10 0%,var(--bg) 60%) fixed;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
.title,.nm.brandh,header b,#ibox .nm,#ibox .wh,.wh2{font-family:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;letter-spacing:.3px}
body{display:flex;justify-content:center;direction:inherit}
#app{width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px;font-weight:700}
header .ic{width:34px;height:34px;display:grid;place-items:center;background:var(--card);border-radius:10px;cursor:pointer}
.online{display:block;width:max-content;margin:0 auto 10px;background:rgba(217,164,65,.14);color:var(--acc);font-size:11px;padding:3px 12px;border-radius:99px}
.search{margin:0 16px 12px;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px;width:calc(100% - 32px);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;flex:0 0 auto;min-height:52px;align-items:center}
#app>*{flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card2);padding:8px 18px;border-radius:99px;white-space:nowrap;font-size:13px}
.chip.on{background:var(--acc);color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 90px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.pic{height:110px;display:grid;place-items:center;font-size:54px;background:radial-gradient(circle at 50% 40%,#4a3321,#1d130b)}
.item .in{padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.item b{font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center}
.price{color:var(--acc);font-weight:700;font-size:14px}
.qty{display:flex;align-items:center;gap:6px;background:#1b110a;border-radius:99px;padding:3px}
.qty button{width:24px;height:24px;border-radius:50%;background:#4a3622;color:#fff;font-weight:700}
.qty button.p{background:var(--acc);color:var(--ink)}
.qty span{min-width:14px;text-align:center;font-size:13px}
nav.bot{position:fixed;bottom:0;width:100%;max-width:440px;background:rgba(22,14,8,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 12px}
nav.bot button{background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bot button.on{color:var(--acc)}nav.bot i{font-style:normal;font-size:20px}
.badge{position:absolute;top:-4px;inset-inline-end:-8px;background:var(--acc);color:var(--ink);border-radius:99px;font-size:10px;padding:0 5px;font-weight:700}
.page{padding:6px 16px 120px}
.title{font-size:20px;font-weight:700;margin:6px 0 14px}
.line{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);padding:10px;border-radius:14px;margin-bottom:10px}
.line .e{font-size:34px;width:54px;height:54px;border-radius:10px;display:grid;place-items:center;background:#1b110a}
.line .nm{flex:1}.line small{color:var(--acc)}
.rm{color:#ff6b6b;font-size:11px;background:none;display:block;margin-top:4px}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:6px}
.sum .row{padding:4px 0;color:#d9c7a8}.sum .t{color:var(--tx);font-weight:700;font-size:17px;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}
.cta{position:fixed;bottom:0;width:100%;max-width:440px;padding:12px 16px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.cta .btn{width:100%;font-size:16px;padding:15px;border-radius:14px;display:block}
.tabs{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:none;padding:10px;border-radius:9px;font-size:13px}.tabs button.on{background:#160e08;border:1px solid var(--bd)}
label{display:block;font-size:12px;color:#e6d5b8;margin:12px 0 6px}
.inp{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:13px;outline:none;direction:ltr;text-align:left}
.inp:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:5px;background:#3a2a1a;border-radius:9px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.tot{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:6px}
.tot big{font-size:26px;font-weight:800;display:block;direction:ltr;text-align:right}
.note{border:1px dashed var(--bd);border-radius:12px;padding:12px;font-size:12px;color:#b9a688;margin-top:16px}
.steps{display:flex;flex-direction:column;gap:0;margin:18px 6px}
.stp{display:flex;gap:12px;align-items:flex-start;padding-bottom:20px;position:relative;color:var(--muted)}
.stp:not(:last-child)::before{content:'';position:absolute;inset-inline-start:11px;top:24px;bottom:0;width:2px;background:var(--bd)}
.stp .c{width:24px;height:24px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:12px;z-index:1}
.stp.on{color:var(--tx)}.stp.on .c{background:var(--acc);color:var(--ink)}
.pic{overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;width:100%;max-width:440px;padding:18px 16px 22px;max-height:88vh;overflow:auto}
.opts{display:flex;flex-wrap:wrap;gap:8px}.oc{background:var(--card2);border:1px solid var(--bd);padding:9px 14px;border-radius:99px;font-size:13px;color:var(--tx)}.oc.on{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:700}
.oc2{font-size:12px;color:#ffd27a;margin-top:3px}
.wl{width:96px;height:96px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid var(--acc);display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.4)}.wl img{width:100%;height:100%;object-fit:cover}.wl:not(:has(img:not([hidden])))::after{content:'☕';font-size:46px}
#intro{position:fixed;inset:0;z-index:200;background:#000;overflow:hidden;transition:opacity .6s}
#intro[hidden]{display:none!important}#intro.out{opacity:0}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ishade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.35) 42%,rgba(0,0,0,0) 70%)}
#ibox{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 34px;max-width:480px;margin:0 auto;text-align:center;color:#fff}
#ibox .nm{font-size:22px;font-weight:800;margin-bottom:4px;text-shadow:0 2px 8px #000}
#ibox .sub{font-size:12.5px;opacity:.9;line-height:1.8;margin:0 0 12px;text-shadow:0 1px 6px #000}
#ibox .lgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#ibox .lgs button{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(20,20,20,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:13px 8px;color:#fff;font-size:16px;font-weight:700}
#ibox .lgs button.on{border-color:var(--acc);background:rgba(217,164,65,.3)}
#ibox .wt{font-size:13px;color:var(--acc);margin-bottom:4px;font-weight:700;text-shadow:0 1px 6px #000}
#ibox .wh{font-size:27px;font-weight:800;line-height:1.35;margin:0 6px 8px;text-shadow:0 2px 10px #000}
#ibox .btn{width:100%;font-size:17px;padding:15px;border-radius:14px;margin-top:10px}
#iskip{position:absolute;top:14px;inset-inline-end:14px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:6px 14px;font-size:12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lg{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px 18px;color:var(--tx);font-size:18px}.lg.on{border-color:var(--acc);background:var(--card2)}
.empty{text-align:center;color:var(--muted);padding:60px 0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--ink);padding:9px 18px;border-radius:99px;font-weight:700;font-size:13px;z-index:9}
</style></head>
<body>
<div id="app"></div>
<div id="intro" hidden>
 <video id="iv" poster="intro.jpg" muted playsinline webkit-playsinline preload="auto"><source src="intro.mp4" type="video/mp4"></video>
 <div class="ishade"></div>
 <div id="ibox"></div>
 <button id="iskip" type="button" hidden></button>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="store.js"></script>
<script src="i18n.js"></script>
<script src="i18n-staff.js"></script>
<script>
const q = new URLSearchParams(location.search);
const table = parseInt(q.get('table')) || null;
let view = 'menu', cat = 'all', term = '', cart = [];
try { cart = JSON.parse(sessionStorage.getItem('cart') || '[]'); if (!Array.isArray(cart)) cart = []; } catch (e) { cart = []; }
const SK = 'myOrders_' + (table || 0);
let myIds = []; try { myIds = JSON.parse(localStorage.getItem(SK) || '[]'); } catch (e) {}
function saveIds() { localStorage.setItem(SK, JSON.stringify(myIds)); }
let seenChat = parseInt(sessionStorage.getItem('seenChat') || '0');
function chatMsgs() { const s = load(); return (s.chat && s.chat[table || 'tk']) || []; }
function unread() { return chatMsgs().filter(m => m.from === 'w' && m.t > seenChat).length; }
if (myIds.length) view = 'track';
let welcomed = false; try { welcomed = !!sessionStorage.getItem('smt_welcomed'); } catch (e) {}
if (!welcomed) view = 'menu';
let prevView = 'menu';
const $ = s => document.querySelector(s);
const prod = id => MENU.find(x => x.id == id);
const items = () => cart.map(l => { const m = prod(l.id); return m ? { ...m, qty: l.qty, opts: l.opts || [], note: l.note || '', k: l.k } : null; }).filter(Boolean);
const count = () => items().reduce((a, i) => a + i.qty, 0);
const sub = () => items().reduce((a, i) => a + i.price * i.qty, 0);
const FEE = 0.5;
let orderNote = sessionStorage.getItem('onote') || '';
function saveCart() { sessionStorage.setItem('cart', JSON.stringify(cart)); }
const qtyOf = id => cart.filter(l => l.id == id).reduce((a, l) => a + l.qty, 0);
function addLine(id, opts, note) {
  opts = opts || []; note = (note || '').trim();
  const ex = cart.find(l => l.id == id && !l.note && !note && JSON.stringify(l.opts || []) === JSON.stringify(opts));
  if (ex) ex.qty++; else cart.push({ k: Date.now() + '_' + Math.floor(Math.random() * 1e6), id, qty: 1, opts, note });
  saveCart(); render();
}
function lineQty(k, d) { const l = cart.find(x => x.k === k); if (!l) return; l.qty += d; if (l.qty <= 0) cart = cart.filter(x => x !== l); saveCart(); render(); }
function prodMinus(id) { const ls = cart.filter(l => l.id == id); if (ls.length) lineQty(ls[ls.length - 1].k, -1); }
function plus(id) { const m = prod(id); if (m && (m.opts || []).some(g => OPTION_GROUPS[g])) openSheet(id); else addLine(id); }
function setNote(k, v) { const l = cart.find(x => x.k === k); if (l) { l.note = v.slice(0, 120); saveCart(); } }
const pic = m => m.img ? `<img src="${m.img}" alt="">` : esc(m.emoji || '🍽');
/* option sheet: pick sugar / salt / ... + a free note before adding */
let sheet = null;
function openSheet(id) { const m = prod(id); sheet = { id, sel: {}, note: '' }; (m.opts || []).forEach(g => { if (OPTION_GROUPS[g]) sheet.sel[g] = OPTION_GROUPS[g].def; }); render(); }
function pick(g, v) { sheet.sel[g] = v; render(); }
function closeSheet() { sheet = null; render(); }
function confirmSheet() { const m = prod(sheet.id); const opts = (m.opts || []).filter(g => OPTION_GROUPS[g]).map(g => sheet.sel[g]); const note = sheet.note; sheet = null; addLine(m.id, opts, note); }
function sheetHtml() {
  if (!sheet) return '';
  const m = prod(sheet.id);
  return `<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sh"><div class="row"><b style="font-size:17px">${esc(pname(m))}</b><span class="price">${money(m.price)}</span></div>
  ${(m.opts || []).filter(g => OPTION_GROUPS[g]).map(g => `<label>${esc(tr(OPTION_GROUPS[g].name))}</label><div class="opts">${OPTION_GROUPS[g].choices.map(c => `<button class="oc ${sheet.sel[g] === c ? 'on' : ''}" onclick="pick('${g}','${c}')">${esc(tr(c))}</button>`).join('')}</div>`).join('')}
  <label>${t('sheet_note')}</label><input class="inp" style="direction:inherit;text-align:start" maxlength="120" value="${esc(sheet.note)}" oninput="sheet.note=this.value" placeholder="${esc(t('sheet_ph'))}">
  <button class="btn" style="width:100%;margin-top:14px;padding:14px" onclick="confirmSheet()">${t('add')}</button></div></div>`;
}
function go(v) { view = v; render(); scrollTo(0, 0); }
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }

function qtyCtl(id) {
  const n = qtyOf(id);
  return `<div class="qty"><button class="p" onclick="plus(${id})">+</button>${n ? `<span>${n}</span><button onclick="prodMinus(${id})">−</button>` : ''}</div>`;
}
function lineCtl(k, n) { return `<div class="qty"><button class="p" onclick="lineQty('${k}',1)">+</button><span>${n}</span><button onclick="lineQty('${k}',-1)">−</button></div>`; }
function nav() {
  const b = (v, i, t, extra = '') => `<button class="${view === v ? 'on' : ''}" onclick="go('${v}')"><i>${i}</i>${t}${extra}</button>`;
  return `<nav class="bot">${b('menu', '🏠', t('n_menu'))}${b('cart', '🛒', t('n_cart'), count() ? `<span class="badge">${count()}</span>` : '')}${b('track', '📋', t('n_orders'))}${myIds.length ? b('chat', '💬', t('n_waiter'), unread() ? `<span class="badge">${unread()}</span>` : '') : ''}</nav>`;
}
function vMenu() {
  if (cat !== 'all' && !CATS[cat]) cat = 'all';
  const list = MENU.filter(m => !m.hidden && (cat === 'all' || m.cat === cat) && (m.name.includes(term) || pname(m).toLowerCase().includes(term.toLowerCase())));
  return `<div style="display:flex;justify-content:center;padding-top:14px"><span class="brand"><img data-brand-logo hidden alt=""><b data-brand-name></b></span></div><header><div class="ic" onclick="openLang()" title="${esc(t('change_lang'))}">🌐</div><span>${table ? t('table', table) : t('takeaway')}</span><div class="ic" onclick="go('cart')">🛒</div></header>
  <span class="online">${cloudOn() ? t('online') : t('local')}</span>
  <input class="search" placeholder="${esc(t('search'))}" value="${esc(term)}" oninput="term=this.value;render(true)">
  <div class="chips">${['all', ...Object.keys(CATS)].map(c => `<div class="chip ${cat === c ? 'on' : ''}" onclick="cat='${c}';render()">${c === 'all' ? t('all') : esc(cname(c))}</div>`).join('')}</div>
  <div class="grid">${list.map(m => `<div class="item"><div class="pic">${pic(m)}</div><div class="in"><b>${esc(pname(m))}</b><div class="row"><span class="price">${money(m.price)}</span>${qtyCtl(m.id)}</div></div></div>`).join('') || '<div class="empty" style="grid-column:1/-1">' + t('none') + '</div>'}</div>${nav()}${sheetHtml()}`;
}
function vCart() {
  const it = items();
  if (!it.length) return `<div class="page"><div class="title">${t('cart_title')}</div><div class="empty">🛒<br>${t('cart_empty')}</div></div>${nav()}`;
  return `<div class="page"><div class="row"><div class="title">${t('cart_title')}</div><small style="color:var(--muted)">${t('n_items', count())}</small></div>
  ${it.map(i => `<div class="line" style="flex-wrap:wrap"><div class="e" style="overflow:hidden">${pic(i)}</div><div class="nm"><b>${esc(pname(i))}</b>${i.opts.length ? `<div class="oc2">${esc(i.opts.map(tr).join(' · '))}</div>` : ''}<small>${money(i.price)}</small><button class="rm" onclick="lineQty('${i.k}',-${i.qty})">${t('remove')}</button></div>${lineCtl(i.k, i.qty)}
  <input class="inp" style="direction:inherit;text-align:start;width:100%;margin-top:6px;padding:9px;font-size:13px" maxlength="120" placeholder="${esc(t('line_note'))}" value="${esc(i.note)}" oninput="setNote('${i.k}',this.value)"></div>`).join('')}
  <label>${t('order_note')}</label><textarea class="inp" rows="2" maxlength="200" style="direction:inherit;text-align:start" placeholder="${esc(t('order_note_ph'))}" oninput="orderNote=this.value;sessionStorage.setItem('onote',this.value)">${esc(orderNote)}</textarea>
  <div class="sum"><div class="row"><span>${t('subtotal')}</span><span>${money(sub())}</span></div><div class="row"><span>${t('fee')}</span><span>${money(FEE)}</span></div><div class="row t"><span>${t('total')}</span><span class="price">${money(sub() + FEE)}</span></div></div><div class="note" style="margin-top:12px">${t('pay_note')}</div></div>
  <div class="cta"><button class="btn" onclick="sendOrder()">${t('send')}</button></div>`;
}
let finished = false;
function sendOrder() {
  unlockAudio();
  const it = items().map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty, st: i.st, cat: i.cat, opts: i.opts, note: i.note }));
  if (!it.length) return toast(t('t_empty'));
  toast(t('t_sending'));
  addOrder(table, it, o => {
    if (!o) return toast(t('t_fail'));
    finished = false; myIds.push(o.id); saveIds();
    cart = []; orderNote = ''; sessionStorage.removeItem('cart'); sessionStorage.removeItem('onote'); go('track');
  }, orderNote);
}
function reqPayT(m) { unlockAudio(); requestPayTable(table, m); toast(m === 'cash' ? t('t_cash') : t('t_card')); }
function callWaiter() { unlockAudio(); sendChat(table, 'c', 'الزبون', '🙋 الزبون ينادي النادل', 'call', ok => toast(ok ? t('t_called') : t('t_sendfail')), LANG); }
function quick(t) { unlockAudio(); sendChat(table, 'c', 'الزبون', t, 'msg', null, LANG); }
function sendMsg() { const i = $('#cmsg'); const t = i.value.trim(); if (!t) return; i.value = ''; unlockAudio(); sendChat(table, 'c', 'الزبون', t, 'msg', null, LANG); }
function vTrack() {
  if (!synced()) return `<div class="page"><div class="empty">${t('loading')}</div></div>${nav()}`;
  const s = load();
  const all = myIds.map(id => s.orders.find(o => o.id === id)).filter(Boolean);
  const act = all.filter(o => !(o.paid && o.status === 'served'));
  if (!act.length) {
    if (all.length) finished = true;
    if (myIds.length) { myIds = []; saveIds(); }
    const done = finished;
    return `<div class="page"><div class="title">${t('my_orders')}</div><div class="empty">${done ? t('thanks') : '📋<br>' + t('no_order')}</div><button class="btn" style="width:100%" onclick="go('menu')">${t('new_order')}</button></div>${nav()}`;
  }
  const order = ['pending', 'new', 'preparing', 'ready', 'served'];
  const wn = [...new Set(act.map(o => o.waiter).filter(Boolean))].join('، ');
  const cards = act.map(o => {
    const idx = order.indexOf(o.status);
    const lbl = [t('st0'), t('st1', o.waiter || ''), t('st2'), t('st3', o.waiter || ''), t('st4')][idx];
    return `<div class="sum" style="margin-bottom:12px"><div class="row"><b>${t('invoice', o.id)}</b><span class="price">${o.paid ? t('paid') : money(o.total + FEE)}</span></div>
    <div style="margin:8px 0 4px;font-weight:700;color:${o.status === 'ready' ? 'var(--acc)' : 'inherit'}">${lbl}</div><div class="bar"><i style="width:${(idx + 1) * 20}%"></i></div>
    ${o.items.map(i => `<div class="row" style="font-size:13px"><span>${custItem(i)}</span><span>${money(i.price * i.qty)}</span></div>`).join('')}${o.note ? `<div class="oc2" style="margin-top:6px">📝 ${esc(o.note)}</div>` : ''}</div>`;
  }).join('');
  const payable = act.filter(o => !o.paid && o.status !== 'pending');
  const req = payable.find(o => o.payReq);
  const tot = payable.reduce((a, o) => a + o.total + FEE, 0);
  let pay = '';
  if (req) pay = `<div class="note" style="margin-top:0">${req.payReq === 'cash' ? t('pay_wait_cash', wn, money(tot)) : t('pay_wait_card', wn)}</div>`;
  else if (payable.length) pay = `<div class="title" style="font-size:16px;margin-top:6px">${t('ask_bill', money(tot))}</div><div class="two"><button class="btn" onclick="reqPayT('cash')">${t('cash')}</button><button class="btn" onclick="reqPayT('card')">${t('card')}</button></div>`;
  const hint = audioReady() ? '' : `<div class="note" style="margin:0 0 12px;color:var(--acc)" onclick="unlockAudio();render()">${t('audio_hint')}</div>`;
  return `<div class="page"><div class="title">${table ? t('my_table', table) : t('my_takeaway')}${wn ? t('with_waiter', wn) : ''}</div>${hint}${cards}
  <div class="two" style="margin-bottom:12px"><button class="btn ghost" onclick="go('menu')">${t('more')}</button><button class="btn ghost" onclick="callWaiter()">${t('call')}</button></div>${pay}</div>${nav()}`;
}
function vChat() {
  seenChat = Date.now(); sessionStorage.setItem('seenChat', seenChat);
  const m = chatMsgs();
  const wn = (() => { const s = load(); return tableWaiter(s, table); })();
  return `<div class="page"><div class="title">${t('chat_title')}${wn ? ' ' + esc(wn) : ''}</div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;min-height:120px">${m.length ? m.map(x => `<div style="align-self:${x.from === 'c' ? 'flex-start' : 'flex-end'};max-width:80%;background:${x.from === 'c' ? 'var(--acc)' : 'var(--card2)'};color:${x.from === 'c' ? 'var(--ink)' : 'var(--tx)'};padding:9px 13px;border-radius:14px;font-size:14px">${x.from === 'w' ? '<small style="opacity:.7;display:block">' + esc(x.name) + '</small>' : ''}${esc(tr(x.text))}${x.from === 'w' && tr(x.text) === x.text ? ` <a style="font-size:11px;opacity:.8;color:inherit" target="_blank" rel="noopener" href="https://translate.google.com/?sl=auto&tl=${LANG}&op=translate&text=${encodeURIComponent(x.text)}">🌐</a>` : ''}</div>`).join('') : '<div class="empty" style="padding:30px 0">' + t('chat_empty') + '</div>'}</div>
  <div class="two" style="margin-bottom:8px"><button class="btn ghost" onclick="callWaiter()">${t('call')}</button><button class="btn ghost" onclick="quick('💧 أريد ماء')">${t('q_water')}</button><button class="btn ghost" onclick="quick('🧂 أحتاج أدوات إضافية')">${t('q_tools')}</button><button class="btn ghost" onclick="quick('⚠️ عندي ملاحظة على الطلب')">${t('q_note')}</button></div>
  <div style="display:flex;gap:8px"><input id="cmsg" class="inp" style="direction:inherit;text-align:start" placeholder="${esc(t('chat_ph'))}" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn" onclick="sendMsg()">${t('chat_send')}</button></div></div>${nav()}`;
}
function newOrder() { go('menu'); }
/* ---- intro video + language picker + welcome (once per scan) ---- */
let introLang = '', _isig = '';
function introPref() { let p = ''; try { p = localStorage.getItem('smt_lang_pref') || ''; } catch (e) {} if (!LANGS[p]) p = Object.keys(LANGS).find(k => (navigator.language || '').toLowerCase().startsWith(k)) || 'en'; return p; }
function introRender(force) {
  const box = $('#ibox'); if (!box) return;
  const nm = BRAND.name || 'Smart Tables', sig = introLang + '|' + nm + '|' + LANG;
  if (sig === _isig && !force) return; _isig = sig;
  if (!introLang) {
    box.innerHTML = `<div class="nm">${esc(nm)}</div><div class="sub" dir="ltr">Choose your language · اختر لغتك · Elige tu idioma · Choisissez votre langue</div>
    <div class="lgs" dir="ltr">${Object.keys(LANGS).map(k => `<button type="button" onclick="introPick('${k}')"><span style="font-size:24px">${LANGS[k].flag}</span>${LANGS[k].name}</button>`).join('')}</div>`;
    $('#iskip').hidden = true;
  } else {
    box.innerHTML = `<div class="wt">${esc(table ? t('table', table) : t('takeaway'))}</div><div class="wh">${esc(t('welcome', nm))}</div><div class="sub">${t('welcome_sub')}</div>
    <button class="btn" type="button" onclick="introClose()">${t('start')}</button>`;
    $('#iskip').hidden = true;
  }
}
function introPick(l) {
  introLang = l; setLang(l);
  const v = $('#iv'); try { v.muted = false; const p = v.play(); p && p.catch && p.catch(() => { v.muted = true; v.play().catch(() => {}); }); } catch (e) {}
  introRender(true);
}
function introClose() {
  const el = $('#intro'); if (!el || el.hidden) return;
  if (!introLang) setLang(introPref());
  try { $('#iv').pause(); } catch (e) {}
  welcomed = true; try { sessionStorage.setItem('smt_welcomed', '1'); } catch (e) {}
  unlockAudio(); el.classList.add('out'); setTimeout(() => { el.hidden = true; }, 600);
  go(myIds.length ? 'track' : 'menu');
}
function introFallback() { const el = $('#intro'); if (el) el.hidden = true; if (!welcomed) { view = 'lang'; render(); } }
function introStart() {
  if (welcomed) return;
  const el = $('#intro'), v = $('#iv'); el.hidden = false; introRender(true);
  v.addEventListener('ended', introClose);
  v.addEventListener('error', introFallback);
  v.querySelector('source').addEventListener('error', introFallback);
  try { const p = v.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  /* the load error may have fired before the listeners existed: re-check (NETWORK_NO_SOURCE = 3) */
  [800, 2500].forEach(ms => setTimeout(() => { if (!el.hidden && !welcomed && (v.error || v.networkState === 3)) introFallback(); }, ms));
}
/* ---- plain language picker (change language later) ---- */
function openLang() { prevView = view; view = 'lang'; render(); }
function pickLang(l) {
  setLang(l);
  if (welcomed) { view = prevView === 'lang' ? 'menu' : prevView; render(); } else go('welcome');
}
function startOrder() { welcomed = true; try { sessionStorage.setItem('smt_welcomed', '1'); } catch (e) {} unlockAudio(); go(myIds.length ? 'track' : 'menu'); }
function brandTop() { return `<div style="text-align:center;padding-top:34px"><div class="wl"><img data-brand-logo hidden alt=""></div></div>`; }
function vLang() {
  let pref = ''; try { pref = localStorage.getItem('smt_lang_pref') || ''; } catch (e) {}
  if (!LANGS[pref]) pref = Object.keys(LANGS).find(k => (navigator.language || '').toLowerCase().startsWith(k)) || '';
  return `<div class="page" style="padding-top:8px">${brandTop()}<div style="text-align:center;margin:10px 0 4px"><b data-brand-name style="font-size:22px"></b></div>
  <div style="text-align:center;color:var(--muted);font-size:13px;margin:6px 0 20px;line-height:1.9" dir="ltr">Choose your language · اختر لغتك<br>Elige tu idioma · Choisissez votre langue</div>
  <div style="display:flex;flex-direction:column;gap:12px">${Object.keys(LANGS).map(k => `<button class="lg ${pref === k ? 'on' : ''}" dir="ltr" onclick="pickLang('${k}')"><span style="font-size:28px">${LANGS[k].flag}</span><b>${LANGS[k].name}</b></button>`).join('')}</div></div>`;
}
function vWelcome() {
  const nm = BRAND.name || 'Smart Tables';
  return `<div class="page" style="text-align:center;padding-top:8px">${brandTop()}
  <div style="font-size:15px;color:var(--acc);margin:22px 0 6px">${esc(table ? t('table', table) : t('takeaway'))}</div>
  <div style="font-size:28px;font-weight:800;line-height:1.35;margin:4px 8px 14px">${esc(t('welcome', nm))}</div>
  <div style="color:#d9c7a8;font-size:14px;line-height:1.9;margin:0 10px 30px">${t('welcome_sub')}</div>
  <button class="btn" style="width:100%;font-size:17px;padding:16px;border-radius:14px" onclick="startOrder()">${t('start')}</button>
  <button class="btn ghost" style="width:100%;margin-top:10px" onclick="welcomed=false;view='lang';render()">🌐 ${t('change_lang')}</button></div>`;
}
function render(keepFocus) {
  setTimeout(applyBrand, 0);
  const a = $('#app'); const f = document.activeElement && document.activeElement.className === 'search';
  const cm = $('#cmsg'), cmv = cm ? cm.value : '', cmf = cm && document.activeElement === cm;
  a.innerHTML = { menu: vMenu, cart: vCart, track: vTrack, chat: vChat, lang: vLang, welcome: vWelcome }[view]();
  const c2 = $('#cmsg'); if (c2) { c2.value = cmv; if (cmf) c2.focus(); }
  if (f) { const i = $('.search'); i.focus(); i.setSelectionRange(term.length, term.length); }
}
render();
introStart();
onChange(() => { if (view === 'track' || view === 'chat') render(); if (!$('#intro').hidden) introRender(); }, 1500);
watchEvents(e => {
  if (!myIds.length) return;
  if (e.order && myIds.includes(e.order)) {
    if (e.type === 'accepted') { toast(t('ev_accepted', e.waiter)); alertUser(t('ev_accepted_say', e.waiter, e.order), LANGS[LANG].voice); }
    if (e.type === 'order_ready') { toast(t('ev_ready', e.waiter)); alertUser(t('ev_ready_say', e.order, e.waiter), LANGS[LANG].voice); }
  }
  if (e.type === 'chat' && e.from === 'w' && e.table === (table || null)) { toast('💬 ' + e.name + ': ' + e.text); alertUser(t('ev_chat_say', e.name, e.text), LANGS[LANG].voice); }
  render();
});
document.addEventListener('click', () => unlockAudio(), { once: true });
</script></body></html>
