<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Waiter</title>
<link rel="stylesheet" href="shared.css">
<style>
:root{--bg:#121110;--card:#1b1917;--bd:#2c2926;--tx:#f1ece6;--acc:#ff6a1a}
body{display:flex;justify-content:center;direction:inherit}
.wl{width:auto;padding:8px;font-size:13px}
.c a{color:#7cc4ff;font-size:11px}
.wrap{width:100%;max-width:520px;padding:14px 14px 60px}
.login{min-height:90vh;display:flex;flex-direction:column;justify-content:center;gap:12px}
.login h1{font-size:26px}.login p{color:var(--muted);font-size:13px}
.inp{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;outline:none}
.inp:focus{border-color:var(--acc)}
.btn.big{width:100%;padding:15px;font-size:16px;border-radius:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top b{font-size:17px}.top small{color:var(--muted);display:block;font-size:12px}
.snd{display:block;width:100%;margin-bottom:10px;background:#3a1f10;color:var(--acc);border:1px solid var(--acc);border-radius:12px;padding:12px;font-weight:700}
h2{font-size:14px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
h2 span{background:var(--acc);color:#111;border-radius:99px;padding:0 9px;font-size:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;border-inline-start:4px solid var(--c,var(--bd))}
.c .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.c .it{font-size:13px;color:#cfc8bf;line-height:1.8;margin-bottom:10px}
.c .m{font-size:11px;color:var(--muted)}
.st{font-size:11px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--c)}
.c.pending{--c:#ff4d4d}.c.new{--c:var(--acc)}.c.preparing{--c:#ffa722}.c.ready{--c:#3ddc6e;animation:p 1.2s infinite}.c.served{--c:#8d8a85}
@keyframes p{50%{background:#14301d}}
.pay{background:#1c2733;border:1px solid #2f4a66;border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px}
.pay b{color:#7cc4ff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--muted);text-align:center;font-size:13px;padding:14px 0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--acc);color:#111;padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;z-index:9;max-width:90vw;text-align:center}
.gate{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.gate h2{font-size:22px;margin:0}.gate p{color:var(--muted);font-size:14px;max-width:320px}
.gate[hidden]{display:none}
.tools{display:flex;gap:8px;margin-bottom:10px}.tools button{flex:1}
.banner{position:fixed;top:0;left:0;right:0;background:var(--acc);color:#111;padding:14px;font-weight:800;text-align:center;z-index:10;font-size:15px}
</style></head><body>
<div class="wrap">
 <div id="login" class="login" hidden>
  <div><span class="brand"><img data-brand-logo hidden alt=""><b data-brand-name></b></span></div><select class="inp wl" style="align-self:flex-start" onchange="setWL(this.value)" data-langsel></select><h1>🧑‍🍳 <span data-t="w_title"></span></h1><p data-t="w_login_p"></p>
  <select class="inp" id="wsel"></select>
  <input class="inp" id="wpw" type="password" autocomplete="current-password" data-tp="w_pw" onkeydown="if(event.key==='Enter')login()">
  <div id="lhint" style="color:var(--muted);font-size:13px;min-height:18px"></div>
  <button class="btn big" onclick="login()" data-t="w_enter"></button>
 </div>
 <div id="gate" class="gate" hidden><h2 data-t="w_gate_h"></h2><p data-t="w_gate_p"></p><button class="btn big" style="max-width:320px" onclick="activate()" data-t="w_gate_btn"></button></div>
 <div id="app" hidden>
  <div style="margin-bottom:8px"><span class="brand"><img data-brand-logo hidden alt=""><b data-brand-name></b></span></div>
  <div class="top"><div><b id="who"></b><small id="zl"></small></div><div style="display:flex;gap:6px"><select class="inp" id="zsel" style="width:auto;padding:8px" onchange="chZone()"></select><select class="inp wl" onchange="setWL(this.value)" data-langsel></select><button class="btn ghost" onclick="logout()" data-t="w_logout"></button></div></div>
  <div class="tools"><button class="btn ghost" onclick="testSound()" data-t="w_testsound"></button><span id="vs" class="pill" style="align-self:center"></span></div>
  <h2><b data-t="w_h_new"></b> <span id="n1">0</span></h2><div id="l1"></div>
  <h2><b data-t="w_h_mine"></b> <span id="n2">0</span></h2><div id="l2"></div>
  <h2><b data-t="w_h_chat"></b> <span id="n3">0</span></h2><div id="l3"></div>
 </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="store.js"></script>
<script src="i18n.js"></script>
<script src="i18n-staff.js"></script>
<script>
const $ = s => document.querySelector(s);
let me = '', zone = localStorage.getItem('smt_wzone') || 'all';
let sess = null; try { sess = JSON.parse(localStorage.getItem('smt_wsess') || 'null'); } catch (e) {}
if (sess && sess.name) me = sess.name; // tentative until the cloud config confirms it
try { setLang(localStorage.getItem(WLANG_KEY) || 'ar'); } catch (e) {}
function applyStatic() {
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(e => { e.placeholder = t(e.dataset.tp); });
  document.querySelectorAll('[data-langsel]').forEach(s => { s.innerHTML = Object.keys(LANGS).map(k => `<option value="${k}"${k === LANG ? ' selected' : ''}>${LANGS[k].flag} ${LANGS[k].name}</option>`).join(''); });
  document.title = t('w_title');
}
function setWL(l) { setLang(l); try { localStorage.setItem(WLANG_KEY, l); } catch (e) {} _wsig = ''; applyStatic(); show(); gate(); }
function wlist() { return ((_cfg && _cfg.waiters) || []).filter(w => !w.off); }
function checkSession() {
  if (!cfgReady()) return;
  const w = sess && ((_cfg.waiters) || []).find(x => x.id === sess.id);
  if (w && !w.off && w.h === sess.h) me = w.name;
  else { if (sess) { sess = null; localStorage.removeItem('smt_wsess'); } me = ''; }
}
let _wsig = '';
function refreshLogin() {
  const ws = wlist(), sig = ws.map(w => w.id + w.name).join('|') + cfgReady();
  if (sig === _wsig || document.activeElement === $('#wsel')) return;
  _wsig = sig;
  $('#wsel').innerHTML = ws.length ? ws.map(w => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('') : '<option value="">—</option>';
  $('#lhint').textContent = ws.length ? '' : (cfgReady() ? t('w_nowaiters') : t('w_loading'));
}
const zoneOpts = (sel) => `<option value="all"${sel === 'all' ? ' selected' : ''}>${t('w_allz')}</option>` + ZONES.map(z => `<option value="${z.id}"${sel === z.id ? ' selected' : ''}>${z.name}</option>`).join('');

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function banner(t) { const d = document.createElement('div'); d.className = 'banner'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 5000); }
function show() {
  checkSession();
  $('#login').hidden = !!me; $('#app').hidden = !me;
  if (me) { $('#who').textContent = t('w_hi', me); $('#zsel').innerHTML = zoneOpts(zone); draw(); }
  else refreshLogin();
}
async function login() {
  if (!cfgReady()) return toast(t('w_retry'));
  const w = ((_cfg.waiters) || []).find(x => x.id === $('#wsel').value && !x.off);
  if (!w) return toast(t('w_t_sel'));
  const h = await hashPw(w.id, $('#wpw').value);
  if (h !== w.h) { $('#wpw').value = ''; return toast(t('w_t_badpw')); }
  sess = { id: w.id, h, name: w.name }; localStorage.setItem('smt_wsess', JSON.stringify(sess));
  zone = w.zone || 'all'; localStorage.setItem('smt_wzone', zone);
  $('#wpw').value = ''; show(); activate();
}
function logout() { sess = null; localStorage.removeItem('smt_wsess'); me = ''; show(); }
function chZone() { zone = $('#zsel').value; localStorage.setItem('smt_wzone', zone); draw(); }
function enableSound() { unlockAudio(); beep(1); }
async function keepAwake() { try { if (navigator.wakeLock && !document.hidden) window._wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
function askNotif() { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} }
function sysNotify(t) { try { if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification(t('w_sys'), { body: t, vibrate: [300, 150, 300], requireInteraction: true }); } catch (e) {} }
function activate() { enableSound(); keepAwake(); askNotif(); say(t('w_v_on'), LANGS[LANG].voice); gate(); }
function testSound() { alertUser(t('w_v_test'), LANGS[LANG].voice); }
function gate() { $('#gate').hidden = !me || audioReady(); const v = voiceOkL(LANGS[LANG].voice); $('#vs').textContent = v ? t('w_voice_ok') : t('w_voice_no'); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); gate(); } });
setInterval(gate, 1000);
/* keep ringing every 6s while a new order in my zone is still unaccepted */
let _n = 0;
setInterval(() => {
  if (!me || !audioReady()) return;
  const s = load();
  const p = s.orders.filter(o => o.status === 'pending' && inZone(o));
  const rd = s.orders.filter(o => o.status === 'ready' && o.waiter === me);
  if (p.length || rd.length) { beep(3); if (++_n % 2 === 0) say(p.length ? t('w_v_pend', p.length) : t('w_v_rd'), LANGS[LANG].voice); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} }
}, 6000);
const inZone = o => zone === 'all' || zoneObj(o.table).id === zone;

function accept(id) { acceptOrder(id, me, ok => { toast(ok ? t('w_t_acc') : t('w_t_late')); draw(); }); }
function served(id) { advance(id); draw(); }
function paid(id) { const o = load().orders.find(x => x.id == id); if (o && o.table) markPaidTable(o.table); else markPaid(id); toast(t('w_t_paid')); draw(); }
function reply(tb, text) { sendChat(tb, 'w', me, text, 'msg'); }
function replyInput(tb) { const i = document.getElementById('ci_' + (tb || 'tk')); const v = i.value.trim(); if (!v) return; i.value = ''; reply(tb, v); }

function card(o, buttons) {
  return `<div class="c ${o.status}"><div class="h"><span>${whereT(o)} · ${zoneOf(o.table)}</span><span class="st">${statusT(o.status)}</span></div>
  <div class="it">${o.items.map(i => custItem(i)).join('<br>')}${o.note ? `<br><small style="color:#ffd27a">${esc(t('w_onote', o.note))}</small>` : ''}</div>
  <div class="m">#${o.id} · ${agoT(o.t)} · ${money(o.total)}</div>${buttons || ''}</div>`;
}
function _draw() {
  if (!me) return;
  const s = load();
  $('#zl').textContent = t('w_zone', zone === 'all' ? t('w_all') : (ZONES.find(z => z.id === zone) || { name: t('w_all') }).name) + ' · ' + (cloudOn() ? t('w_cloud') : t('w_localm'));
  const pend = s.orders.filter(o => o.status === 'pending' && inZone(o)).sort((a, b) => a.t - b.t);
  $('#n1').textContent = pend.length;
  $('#l1').innerHTML = pend.map(o => card(o, `<button class="btn big" style="margin-top:10px" onclick="accept(${o.id})">${t('w_accept')}</button>`)).join('') || `<div class="empty">${t('w_none_new')}</div>`;
  const mine = s.orders.filter(o => o.waiter === me && (o.status !== 'served' || !o.paid)).sort((a, b) => a.t - b.t);
  $('#n2').textContent = mine.length;
  $('#l2').innerHTML = mine.map(o => {
    let b = '';
    if (o.payReq && !o.paid) b += `<div class="pay">${t('w_wantpay')} <b>${o.payReq === 'cash' ? t('w_cashp') : t('w_cardp')}</b></div><button class="btn big" onclick="paid(${o.id})">${t('w_collected')}</button>`;
    else if (o.status === 'ready') b += `<button class="btn big" onclick="served(${o.id})">${t('w_served')}</button>`;
    else if (o.status === 'served' && !o.paid) b += `<div class="m" style="margin-bottom:8px">${t('w_waitpay')}</div><button class="btn ghost big" onclick="paid(${o.id})">${t('w_manual')}</button>`;
    return card(o, b);
  }).join('') || `<div class="empty">${t('w_none_mine')}</div>`;
  const chats = Object.keys(s.chat || {}).filter(k => (s.chat[k] || []).length).map(k => ({ k, tb: k === 'tk' ? null : +k })).filter(c => {
    const w = tableWaiter(s, c.tb); return w === me || (!w && inZone({ table: c.tb }));
  });
  $('#n3').textContent = chats.length;
  $('#l3').innerHTML = chats.map(c => {
    const m = s.chat[c.k].slice(-4);
    return `<div class="c new"><div class="h"><span>${c.tb ? t('w_table', c.tb) : t('w_take')}</span><span class="st">${zoneOf(c.tb)}</span></div>
    <div class="it">${m.map(x => { const sh = tr(x.text); const lk = x.from === 'c' && sh === x.text && x.lang && x.lang !== LANG ? ` <a target="_blank" rel="noopener" href="https://translate.google.com/?sl=auto&tl=${LANG}&op=translate&text=${encodeURIComponent(x.text)}">${t('w_trans')}</a>` : ''; return (x.from === 'c' ? '👤 ' + (x.lang && LANGS[x.lang] ? LANGS[x.lang].flag + ' ' : '') : '🧑‍🍳 ') + esc(sh) + lk; }).join('<br>')}</div>
    <div class="two" style="margin-bottom:8px"><button class="btn ghost" onclick="reply(${c.tb},'في الطريق إليك 🏃')">${t('w_otw')}</button><button class="btn ghost" onclick="reply(${c.tb},'حاضر ✅')">${t('w_ok')}</button><button class="btn ghost" onclick="reply(${c.tb},'لحظة من فضلك ⏳')">${t('w_wait')}</button><button class="btn ghost" onclick="reply(${c.tb},'هل تريد شيئًا آخر؟')">${t('w_more')}</button></div>
    <div style="display:flex;gap:6px"><input class="inp ci" id="ci_${c.k}" placeholder="${esc(t('w_reply_ph'))}" onkeydown="if(event.key==='Enter')replyInput(${c.tb})"><button class="btn" onclick="replyInput(${c.tb})">${t('w_send')}</button></div></div>`;
  }).join('') || `<div class="empty">${t('w_none_chat')}</div>`;
}

watchEvents(e => {
  if (!me) return;
  const mineZone = zone === 'all' || e.zoneId === zone;
  if (e.type === 'new_order' && mineZone) {
    const sp = e.table ? t('w_v_new_t', e.zone, t('w_table', e.table)) : t('w_v_new', e.zone);
    sysNotify(sp); alertUser(sp, LANGS[LANG].voice); banner('🔔 ' + sp);
  }
  if (e.type === 'order_ready' && e.waiter === me) {
    const w = (e.table ? t('w_table', e.table) : t('w_take')) + ', ' + t('w_inv', e.order);
    sysNotify(t('w_b_ready', w)); alertUser(t('w_v_ready', me, w), LANGS[LANG].voice); banner(t('w_b_ready', w));
  }
  if (e.type === 'pay_request' && e.waiter === me) {
    const tb = t('w_table', e.table), sp = t(e.method === 'cash' ? 'w_v_pay_cash' : 'w_v_pay_card', tb);
    sysNotify(sp); alertUser(sp, LANGS[LANG].voice); banner(t('w_b_pay', tb, money(e.total || 0)));
  }
  if (e.type === 'chat' && e.from === 'c' && (e.waiter === me || (!e.waiter && mineZone))) {
    const tb = e.table ? t('w_table', e.table) : t('w_take');
    const known = e.kind === 'call' || tr(e.text) !== e.text || LANG === 'ar' && !e.lang;
    const tx = e.kind === 'call' ? t('w_v_call', tb) : t('w_v_msg', tb, tr(e.text));
    const spoken = known ? tx : t('w_v_msg', tb, '').replace(/[:：]\s*$/, '');
    sysNotify(tx); alertUser(spoken, LANGS[LANG].voice); banner('💬 ' + tx);
  }
  draw();
});
function draw() {
  const f = document.activeElement, fid = f && f.id, vals = {};
  document.querySelectorAll('.ci').forEach(i => vals[i.id] = i.value);
  _draw();
  document.querySelectorAll('.ci').forEach(i => { if (vals[i.id]) i.value = vals[i.id]; });
  if (fid && fid.startsWith('ci_')) { const e = document.getElementById(fid); if (e) e.focus(); }
}
onChange(draw, 2000);
_listeners.push(() => { const was = me; checkSession(); if (was !== me) { show(); if (was) toast(t('w_t_out')); } else if (!me) refreshLogin(); });
applyStatic(); show(); gate(); keepAwake();
</script></body></html>
