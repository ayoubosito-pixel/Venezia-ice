<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>تطبيق النادل</title>
<link rel="stylesheet" href="shared.css">
<style>
:root{--bg:#121110;--card:#1b1917;--bd:#2c2926;--tx:#f1ece6;--acc:#ff6a1a}
body{display:flex;justify-content:center}
.wrap{width:100%;max-width:520px;padding:14px 14px 60px}
.login{min-height:90vh;display:flex;flex-direction:column;justify-content:center;gap:12px}
.login h1{font-size:26px}.login p{color:var(--muted);font-size:13px}
.inp{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;outline:none}
.inp:focus{border-color:var(--acc)}
.btn.big{width:100%;padding:15px;font-size:16px;border-radius:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top b{font-size:17px}.top small{color:var(--muted);display:block;font-size:12px}
.snd{display:block;width:100%;margin-bottom:10px;background:#3a1f10;color:var(--acc);border:1px solid var(--acc);border-radius:12px;padding:12px;font-weight:700}
h2{font-size:14px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
h2 span{background:var(--acc);color:#111;border-radius:99px;padding:0 9px;font-size:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;border-right:4px solid var(--c,var(--bd))}
.c .h{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
.c .it{font-size:13px;color:#cfc8bf;line-height:1.8;margin-bottom:10px}
.c .m{font-size:11px;color:var(--muted)}
.st{font-size:11px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--c)}
.c.pending{--c:#ff4d4d}.c.new{--c:var(--acc)}.c.preparing{--c:#ffa722}.c.ready{--c:#3ddc6e;animation:p 1.2s infinite}.c.served{--c:#8d8a85}
@keyframes p{50%{background:#14301d}}
.pay{background:#1c2733;border:1px solid #2f4a66;border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px}
.pay b{color:#7cc4ff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--muted);text-align:center;font-size:13px;padding:14px 0}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--acc);color:#111;padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;z-index:9;max-width:90vw;text-align:center}
.gate{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.gate h2{font-size:22px;margin:0}.gate p{color:var(--muted);font-size:14px;max-width:320px}
.gate[hidden]{display:none}
.tools{display:flex;gap:8px;margin-bottom:10px}.tools button{flex:1}
.banner{position:fixed;top:0;left:0;right:0;background:var(--acc);color:#111;padding:14px;font-weight:800;text-align:center;z-index:10;font-size:15px}
</style></head><body>
<div class="wrap">
 <div id="login" class="login" hidden>
  <h1>🧑‍🍳 تطبيق النادل</h1><p>أدخل اسمك واختر منطقتك لتصلك تنبيهات الطلبات الجديدة بالصوت.</p>
  <input class="inp" id="nm" placeholder="اسم النادل">
  <select class="inp" id="zn"></select>
  <button class="btn big" onclick="login()">دخول وتفعيل التنبيهات 🔔</button>
 </div>
 <div id="gate" class="gate" hidden><h2>🔔 تفعيل التنبيهات</h2><p>المتصفح يمنع الصوت حتى تلمس الشاشة. المس الزر ليرنّ الهاتف عند وصول كل طلب.</p><button class="btn big" style="max-width:320px" onclick="activate()">تفعيل الصوت الآن</button></div>
 <div id="app" hidden>
  <div class="top"><div><b id="who"></b><small id="zl"></small></div><div style="display:flex;gap:6px"><select class="inp" id="zsel" style="width:auto;padding:8px" onchange="chZone()"></select><button class="btn ghost" onclick="logout()">خروج</button></div></div>
  <div class="tools"><button class="btn ghost" onclick="testSound()">🔊 اختبار الصوت</button><span id="vs" class="pill" style="align-self:center"></span></div>
  <h2>طلبات جديدة بانتظار نادل <span id="n1">0</span></h2><div id="l1"></div>
  <h2>طلباتي <span id="n2">0</span></h2><div id="l2"></div>
 </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="store.js"></script>
<script>
const $ = s => document.querySelector(s);
let me = localStorage.getItem('smt_waiter') || '', zone = localStorage.getItem('smt_wzone') || 'all';
const zoneOpts = (sel) => `<option value="all"${sel === 'all' ? ' selected' : ''}>كل المناطق</option>` + ZONES.map(z => `<option value="${z.id}"${sel === z.id ? ' selected' : ''}>${z.name}</option>`).join('');

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function banner(t) { const d = document.createElement('div'); d.className = 'banner'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 5000); }
function show() {
  $('#login').hidden = !!me; $('#app').hidden = !me;
  if (me) { $('#who').textContent = '👋 ' + me; $('#zsel').innerHTML = zoneOpts(zone); draw(); }
  else $('#zn').innerHTML = zoneOpts('all');
}
function login() {
  const n = $('#nm').value.trim();
  if (!n) return toast('اكتب اسمك أولًا');
  me = n; zone = $('#zn').value;
  localStorage.setItem('smt_waiter', me); localStorage.setItem('smt_wzone', zone);
  show(); activate();
}
function logout() { localStorage.removeItem('smt_waiter'); me = ''; show(); }
function chZone() { zone = $('#zsel').value; localStorage.setItem('smt_wzone', zone); draw(); }
function enableSound() { unlockAudio(); beep(1); }
async function keepAwake() { try { if (navigator.wakeLock && !document.hidden) window._wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
function askNotif() { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} }
function sysNotify(t) { try { if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification('طاولات سمارت', { body: t, vibrate: [300, 150, 300], requireInteraction: true }); } catch (e) {} }
function activate() { enableSound(); keepAwake(); askNotif(); say('التنبيهات مفعّلة'); gate(); }
function testSound() { alertUser('هذا اختبار للتنبيه الصوتي'); }
function gate() { $('#gate').hidden = !me || audioReady(); const v = voiceOk(); $('#vs').textContent = v ? '🗣 الصوت المنطوق متاح' : '🔔 جرس فقط (لا يوجد صوت عربي)'; }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); gate(); } });
setInterval(gate, 1000);
/* keep ringing every 6s while a new order in my zone is still unaccepted */
let _n = 0;
setInterval(() => {
  if (!me || !audioReady()) return;
  const s = load();
  const p = s.orders.filter(o => o.status === 'pending' && inZone(o));
  const rd = s.orders.filter(o => o.status === 'ready' && o.waiter === me);
  if (p.length || rd.length) { beep(3); if (++_n % 2 === 0) say(p.length ? 'يوجد ' + p.length + ' طلب بانتظار نادل' : 'لديك طلب جاهز للتقديم'); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} }
}, 6000);
const inZone = o => zone === 'all' || zoneObj(o.table).id === zone;

function accept(id) { acceptOrder(id, me, ok => { toast(ok ? '✅ استلمت الطلب — ظهر الآن في المطبخ' : 'سبقك نادل آخر لهذا الطلب'); draw(); }); }
function served(id) { advance(id); draw(); }
function paid(id) { markPaid(id); toast('تم تحصيل الدفع ✓'); draw(); }

function card(o, buttons) {
  return `<div class="c ${o.status}"><div class="h"><span>${where(o)} · ${zoneOf(o.table)}</span><span class="st">${STATUS[o.status]}</span></div>
  <div class="it">${o.items.map(i => i.qty + '× ' + i.name).join('<br>')}</div>
  <div class="m">#${o.id} · ${ago(o.t)} · ${money(o.total)}</div>${buttons || ''}</div>`;
}
function draw() {
  if (!me) return;
  const s = load();
  $('#zl').textContent = 'المنطقة: ' + (zone === 'all' ? 'الكل' : ZONES.find(z => z.id === zone).name) + (cloudOn() ? ' · ☁️ متصل' : ' · ⚠️ وضع محلي');
  const pend = s.orders.filter(o => o.status === 'pending' && inZone(o)).sort((a, b) => a.t - b.t);
  $('#n1').textContent = pend.length;
  $('#l1').innerHTML = pend.map(o => card(o, `<button class="btn big" style="margin-top:10px" onclick="accept(${o.id})">✋ قبول الطلب</button>`)).join('') || '<div class="empty">لا توجد طلبات جديدة</div>';
  const mine = s.orders.filter(o => o.waiter === me && (o.status !== 'served' || !o.paid)).sort((a, b) => a.t - b.t);
  $('#n2').textContent = mine.length;
  $('#l2').innerHTML = mine.map(o => {
    let b = '';
    if (o.payReq && !o.paid) b += `<div class="pay">💰 الزبون يريد الدفع: <b>${o.payReq === 'cash' ? 'كاش 💵' : 'بالبطاقة 💳 — أحضر جهاز الدفع'}</b></div><button class="btn big" onclick="paid(${o.id})">✅ تم التحصيل</button>`;
    else if (o.status === 'ready') b += `<button class="btn big" onclick="served(${o.id})">🍽 استلمت الطلب وقدّمته</button>`;
    else if (o.status === 'served' && !o.paid) b += `<div class="m" style="margin-bottom:8px">بانتظار طلب الدفع من الزبون</div><button class="btn ghost big" onclick="paid(${o.id})">تحصيل يدويًا</button>`;
    return card(o, b);
  }).join('') || '<div class="empty">لا توجد طلبات باسمك الآن</div>';
}

watchEvents(e => {
  if (!me) return;
  if (e.type === 'new_order' && (zone === 'all' || e.zoneId === zone)) {
    sysNotify('طلب جديد في ' + e.zone); alertUser('طلب جديد في ' + e.zone + (e.table ? '، طاولة ' + e.table : '')); banner('🔔 طلب جديد — ' + e.zone + (e.table ? ' · طاولة ' + e.table : ''));
  }
  if (e.type === 'order_ready' && e.waiter === me) {
    sysNotify('طلبك جاهز'); alertUser('الطلب جاهز يا ' + me + '، ' + (e.table ? 'طاولة ' + e.table : 'سفري')); banner('✅ طلبك جاهز — ' + (e.table ? 'طاولة ' + e.table : 'سفري'));
  }
  if (e.type === 'pay_request' && e.waiter === me) {
    sysNotify('طلب دفع من طاولة ' + e.table); alertUser('طاولة ' + e.table + ' تريد الدفع ' + (e.method === 'cash' ? 'نقدًا' : 'بالبطاقة، أحضر جهاز الدفع')); banner('💰 طلب دفع — طاولة ' + e.table);
  }
  draw();
}, 1500);
onChange(draw, 2000);
show(); gate(); keepAwake();
</script></body></html>
