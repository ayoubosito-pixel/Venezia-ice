<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقارير الفرع</title>
<link rel="stylesheet" href="shared.css">
<style>
:root{--bg:#17140f;--card:#2a241b;--bd:#3a3226;--tx:#f6efe3;--acc:#f2b233;--side:#1d1913}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hd h1{font-size:26px}.hd p{color:var(--muted);font-size:13px;margin-top:4px}
.hd .r{display:flex;gap:8px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--bd);margin-bottom:16px}
.tabs button{background:none;padding:10px 0;color:var(--muted);border-bottom:2px solid transparent}.tabs .on{color:var(--tx);border-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi small{font-size:11px;color:var(--muted);letter-spacing:.5px}
.kpi b{display:block;font-size:26px;margin-top:6px}
.kpi em{font-style:normal;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(47,209,106,.15);color:var(--ok);margin-right:8px}
.kpi em.d{background:rgba(239,68,68,.15);color:#ff7070}
.g{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.g{grid-template-columns:1fr}}
.card h3{font-size:16px;text-transform:none}.card .sub{color:var(--muted);font-size:12px;margin:-6px 0 10px}
.bars .it{margin-bottom:12px;font-size:13px}.bars .it div{display:flex;justify-content:space-between;margin-bottom:5px}
.bars .pr{height:7px;background:#14110c;border-radius:9px;overflow:hidden}.bars i{display:block;height:100%;background:var(--acc);border-radius:9px}
.donut{display:flex;align-items:center;gap:18px}
.lgd div{font-size:12px;margin-bottom:8px;display:flex;gap:8px;align-items:center}.lgd b{display:block;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;color:var(--muted);text-align:right;padding:10px;letter-spacing:.5px}td{padding:10px;border-top:1px solid var(--bd)}
.ok{color:var(--ok);background:rgba(47,209,106,.12);padding:2px 9px;border-radius:6px;font-size:11px}
svg text{fill:#a89d88;font-size:11px}
</style></head><body>
<div class="app">
<nav class="side"><a href="index.html">☰</a><a href="dashboard.html">▦</a><a href="kds.html">👨‍🍳</a><a class="on" href="reports.html">📊</a><a href="menu.html?table=1">📱</a></nav>
<div class="main">
 <div class="hd"><div><h1>تقارير الفرع</h1><p>إدارة الأداء المالي والتشغيلي · <span id="dt"></span></p></div>
  <div class="r"><button class="btn ghost demo-only" onclick="if(confirm('سيحذف الطلبات الحقيقية ويضع بيانات وهمية. متأكد؟')){seedDemo();draw()}">بيانات تجريبية</button><button class="btn" onclick="window.print()">⬇ تصدير PDF</button></div></div>
 <div class="tabs"><button class="on">يومي</button><button disabled style="opacity:.4">أسبوعي</button><button disabled style="opacity:.4">شهري</button></div>
 <div class="kpis" id="kp"></div>
 <div class="g"><div class="card"><h3>نظرة على الإيرادات</h3><div class="sub">المبيعات بالساعة (اليوم)</div><div id="ch"></div></div>
  <div class="card"><h3>الأكثر مبيعًا</h3><div class="sub">&nbsp;</div><div class="bars" id="tp"></div></div></div>
 <div class="g" style="grid-template-columns:1fr 2fr">
  <div class="card"><h3>توزيع الفئات</h3><div class="donut" id="dn"></div></div>
  <div class="card"><h3>آخر الطلبات</h3><div style="overflow:auto"><table><thead><tr><th>الطلب</th><th>الطاولة</th><th>العناصر</th><th>الإجمالي</th><th>الدفع</th><th>الحالة</th></tr></thead><tbody id="tb"></tbody></table></div></div></div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="store.js"></script>
<script>
const $ = s => document.querySelector(s);
const CC = { coffee: '#f2b233', tea: '#b9ae9a', pastry: '#ffffff', snack: '#d9822b' };
function draw() {
  const s = load(), d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const os = s.orders.filter(o => o.t >= d0.getTime());
  $('#dt').textContent = d0.toLocaleDateString('ar', { dateStyle: 'long' });
  const tot = os.reduce((a, o) => a + o.total, 0), n = os.length;
  $('#kp').innerHTML = [['إجمالي المبيعات', money(tot), '▲ حي', ''], ['صافي الربح (تقديري 34%)', money(tot * .34), '▲', ''], ['عدد الطلبات', n, n ? '▲' : '—', ''], ['متوسط الفاتورة', money(n ? tot / n : 0), '▲', '']]
    .map(k => `<div class="card kpi"><small>${k[0]}</small><b>${k[1]}<em>${k[2]}</em></b></div>`).join('');
  // hourly chart (8..20)
  const hrs = Array.from({ length: 13 }, (_, i) => 8 + i), v = hrs.map(h => os.filter(o => new Date(o.t).getHours() === h).reduce((a, o) => a + o.total, 0));
  const W = 700, H = 260, p = 34, mx = Math.max(10, ...v) * 1.15;
  const x = i => p + i * (W - 2 * p) / 12, y = val => H - p - val / mx * (H - 2 * p);
  let path = `M${x(0)},${y(v[0])}`; for (let i = 1; i < 13; i++) { const cx = (x(i - 1) + x(i)) / 2; path += ` C${cx},${y(v[i - 1])} ${cx},${y(v[i])} ${x(i)},${y(v[i])}`; }
  const peak = v.indexOf(Math.max(...v));
  $('#ch').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b233" stop-opacity=".35"/><stop offset="1" stop-color="#f2b233" stop-opacity="0"/></linearGradient></defs>
   ${[0, 1, 2, 3].map(i => `<line x1="${p}" x2="${W - p}" y1="${p + i * (H - 2 * p) / 3}" y2="${p + i * (H - 2 * p) / 3}" stroke="#3a3226"/>`).join('')}
   <path d="${path} L${x(12)},${H - p} L${x(0)},${H - p}Z" fill="url(#g)"/><path d="${path}" fill="none" stroke="#f2b233" stroke-width="3"/>
   ${hrs.filter((_, i) => i % 2 == 0).map(h => `<text x="${x(h - 8)}" y="${H - 10}" text-anchor="middle">${h > 12 ? h - 12 : h}${h >= 12 ? 'م' : 'ص'}</text>`).join('')}
   ${Math.max(...v) > 0 ? `<g><rect x="${x(peak) - 38}" y="${y(v[peak]) - 38}" width="76" height="30" rx="5" fill="#111"/><text x="${x(peak)}" y="${y(v[peak]) - 26}" text-anchor="middle">${hrs[peak]}:00</text><text x="${x(peak)}" y="${y(v[peak]) - 14}" text-anchor="middle" style="fill:#f2b233;font-weight:700">${money(v[peak])}</text></g><circle cx="${x(peak)}" cy="${y(v[peak])}" r="5" fill="#f2b233"/>` : `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">لا توجد بيانات — اضغط «بيانات تجريبية»</text>`}</svg>`;
  // top items
  const cnt = {}; os.forEach(o => o.items.forEach(i => cnt[i.name] = (cnt[i.name] || 0) + i.qty));
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 5), m = top[0] ? top[0][1] : 1;
  $('#tp').innerHTML = top.map(([k, c]) => `<div class="it"><div><span>${k}</span><span style="color:var(--muted)">${c} مباعة</span></div><div class="pr"><i style="width:${c / m * 100}%"></i></div></div>`).join('') || '<div class="sub">لا بيانات</div>';
  // donut by category
  const cat = {}; os.forEach(o => o.items.forEach(i => { const c = i.cat || (MENU.find(z => z.id === i.id) || {}).cat; cat[c] = (cat[c] || 0) + i.price * i.qty; }));
  const ct = Object.values(cat).reduce((a, b) => a + b, 0) || 1; let off = 0;
  const R = 42, C = 2 * Math.PI * R;
  const segs = Object.entries(cat).map(([k, val]) => { const l = val / ct * C, e = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${CC[k] || '#c9a227'}" stroke-width="16" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off += l; return e; }).join('');
  $('#dn').innerHTML = `<svg width="130" viewBox="0 0 120 120">${segs || `<circle r="${R}" cx="60" cy="60" fill="none" stroke="#3a3226" stroke-width="16"/>`}<text x="60" y="58" text-anchor="middle">الإجمالي</text><text x="60" y="74" text-anchor="middle" style="fill:#f6efe3;font-weight:700;font-size:13px">100%</text></svg>
   <div class="lgd">${Object.entries(cat).map(([k, val]) => `<div><i class="dot" style="background:${CC[k] || '#c9a227'};margin:0"></i><span>${esc(CATS[k] || k)}<b>${Math.round(val / ct * 100)}%</b></span></div>`).join('')}</div>`;
  // orders table
  $('#tb').innerHTML = os.slice().sort((a, b) => b.t - a.t).slice(0, 8).map(o => `<tr><td>#${o.id}</td><td>${o.table || 'سفري'}</td><td>${o.items.reduce((a, i) => a + i.qty, 0)}</td><td>${money(o.total)}</td><td>${{ card: 'بطاقة', cash: 'كاش', wallet: 'محفظة' }[o.method] || '—'}</td><td><span class="ok">${STATUS[o.status]}</span></td></tr>`).join('') || '<tr><td colspan="6" style="color:var(--muted);text-align:center">لا توجد طلبات اليوم</td></tr>';
}
draw(); onChange(draw);
</script></body></html>
